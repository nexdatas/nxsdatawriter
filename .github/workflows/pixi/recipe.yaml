schema_version: 1

context:
  version: "3.24.0"

package:
  name: nxswriter
  version: ${{ version }}

source:
  - path: ../../../

build:
  noarch: python
  number: 0
  script:
    - python -m pip install . -vv --no-deps --no-build-isolation
    - python -m pytest test

requirements:
  host:
    - python
    - setuptools >=61
    - pip
    - wheel
    - numpy
    - nxstools >=4.29.0
    - argcomplete
    - lxml
    - pytango
    - pytz
    - pymysql
    - mysql-client
    - psycopg2
    - pytest
  run:
    - python
    - numpy
    - argcomplete
    - lxml
    - pytango
    - pytz
    - nxstools >=4.29.0
    - pymysql
    - mysql-client
    - psycopg2

tests:
  - python:
      imports:
        - nxswriter
        - nxswriter.ClientSource
        - nxswriter.DataHolder
        - nxswriter.DataSourceFactory
        - nxswriter.DataSourcePool
        - nxswriter.DataSources
        - nxswriter.DBaseSource
        - nxswriter.DecoderPool
        - nxswriter.EAttribute
        - nxswriter.EField
        - nxswriter.EGroup
        - nxswriter.Element
        - nxswriter.ElementThread
        - nxswriter.ELink
        - nxswriter.Errors
        - nxswriter.EStrategy
        - nxswriter.EVirtualField
        - nxswriter.FElement
        - nxswriter.FetchNameHandler
        - nxswriter.H5Elements
        - nxswriter.InnerXMLParser
        - nxswriter.Metadata
        - nxswriter.NexusXMLHandler
        - nxswriter.NXSFromXML
        - nxswriter.NXSWriter
        - nxswriter.PyEvalSource
        - nxswriter.Release
        - nxswriter.StreamSet
        - nxswriter.TangoDataWriter
        - nxswriter.TangoSource
        - nxswriter.ThreadPool
        - nxswriter.Types
      python_version:
        - "*"
  - script:
      - if: unix
        then:
          - test -x "$PREFIX/bin/NXSDataWriter"
          - NXSDataWriter --help
          - python -c 'from nxswriter.TangoDataWriter import WRITERS; assert "h5py" in WRITERS or "h5cpp" in WRITERS'
    requirements:
      run:
        - python


about:
  homepage: https://github.com/nexdatas/nxsdatawriter
  repository: https://github.com/nexdatas/nxsdatawriter
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: NeXus Data Writer tango server
  description: |
    NXSDataWriter is a Tango server which stores NeXuS Data in H5 files
    and/or publishes (meta)data to blissdata redis server.
    The server provides storing data from other Tango devices,
    various databases as well as passed by a user client via JSON strings
    and python snippets.

extra:
  recipe-maintainers:
    - jkotan
